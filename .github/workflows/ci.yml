name: CI Pipeline
 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
 
jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Install dependencies
        run: pip install -r requirements.txt
 
      - name: Lint with flake8
        run: flake8 . --max-line-length=100
 
      - name: Static analysis with pylint
        run: pylint calculator.py --fail-under=8
 
      - name: Security scan with bandit
        run: bandit -r . -x ./test_calculator.py
 
      - name: Run tests with coverage
        run: pytest --cov=calculator --cov-report=term-missing --cov-fail-under=80
 
  deploy:
    needs: build-test-analyze
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy
        run: echo "All checks passed - deploying application..."
